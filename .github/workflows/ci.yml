name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose model
        run: docker compose config >/tmp/compose.yml
      - name: Python syntax
        run: |
          files=$(git ls-files '*.py')
          if [ -n "$files" ]; then python -m py_compile $files; fi
      - name: Monitor tests
        run: |
          pip install --quiet -r monitor/requirements.txt
          python monitor/test_monitor.py
      - name: Validate alert rules parse
        run: python -c "import yaml,sys; yaml.safe_load(open('grafana/provisioning/alerting/rules.yaml'))"
      - name: Build local images
        run: |
          docker compose build
